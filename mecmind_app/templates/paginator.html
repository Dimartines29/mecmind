{% if page_obj %}
    <div class="pagination">
        <span class="step-links">
            {% if page_obj.has_previous %}
                <a href="?page=1{% if encoded_filters %}&filters={{ encoded_filters }}{% endif %}"><i class="fas fa-angle-double-left"></i></a>
                <a href="?page={{ page_obj.previous_page_number }}{% if encoded_filters %}&filters={{ encoded_filters }}{% endif %}"><i class="fas fa-chevron-left"></i></a>

            {% else %}
                <a class="disable"><i class="fas fa-angle-double-left"></i></a>
                <a class="disable"><i class="fas fa-chevron-left"></i></a>
            {% endif %}

            <span>
                Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}
            </span>

            {% if page_obj.has_next %}
                <a href="?page={{ page_obj.next_page_number }}{% if encoded_filters %}&filters={{ encoded_filters }}{% endif %}"><i class="fas fa-chevron-right"></i></a>
                <a href="?page={{ page_obj.paginator.num_pages }}{% if encoded_filters %}&filters={{ encoded_filters }}{% endif %}"><i class="fas fa-angle-double-right"></i></a>

            {% else %}
                <a class="disable"><i class="fas fa-chevron-right"></i></a>
                <a class="disable"><i class="fas fa-angle-double-right"></i></a>
            {% endif %}
        </span>
    </div>
{% endif %}
