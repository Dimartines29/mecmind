<div class="flex items-center justify-center space-x-4 py-6">
    {% for step in steps %}
    <div class="flex items-center {% if not forloop.last %}flex-1{% endif %}">
        <!-- Step Circle -->
        <div class="flex items-center justify-center w-8 h-8 rounded-full border-2 transition-colors
            {% if step.active %}
                bg-blue-600 border-blue-600 text-white
            {% elif step.completed %}
                bg-green-600 border-green-600 text-white
            {% else %}
                bg-white border-slate-300 text-slate-500
            {% endif %}">
            {% if step.completed %}
                <i class="fas fa-check text-sm"></i>
            {% else %}
                <span class="text-sm font-medium">{{ forloop.counter }}</span>
            {% endif %}
        </div>

        <!-- Step Label -->
        <div class="ml-3 {% if not forloop.last %}flex-1{% endif %}">
            <p class="text-sm font-medium
                {% if step.active %}text-blue-600
                {% elif step.completed %}text-green-600
                {% else %}text-slate-500
                {% endif %}">
                {{ step.title }}
            </p>
        </div>

        <!-- Connecting Line -->
        {% if not forloop.last %}
        <div class="flex-1 h-0.5 mx-4
            {% if step.completed %}bg-green-600
            {% else %}bg-slate-300
            {% endif %}"></div>
        {% endif %}
    </div>
    {% endfor %}
</div>
