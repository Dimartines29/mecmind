<button
    class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors bg-blue-500 hover:bg-blue-700 text-white h-10 px-4 py-2 {{ extra_classes }}"
    {% if onclick %}onclick="{{ onclick }}"{% endif %}
    {% if type %}type="{{ type }}"{% endif %}
    {% if disabled %}disabled{% endif %}
    {% if id %}id="{{ id }}"{% endif %}
>
    {% if icon_left %}
        <i class="{{ icon_left }} mr-2"></i>
    {% endif %}

    {{ text|default:"Button" }}

    {% if icon_right %}
        <i class="{{ icon_right }} ml-2"></i>
    {% endif %}
</button>
