<div class="inline-flex items-center space-x-2 {{ extra_classes }}">
    {% if show_spinner != 'false' %}
    <div class="animate-spin rounded-full
        {% if size == 'sm' %}h-4 w-4 border-2
        {% elif size == 'lg' %}h-8 w-8 border-4
        {% else %}h-6 w-6 border-2
        {% endif %}
        border-current border-t-transparent"></div>
    {% endif %}

    {% if text %}
    <span class="text-sm font-medium">{{ text }}</span>
    {% endif %}
</div>
