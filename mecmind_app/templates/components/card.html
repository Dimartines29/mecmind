<div class="rounded-lg border border-slate-200 bg-white shadow-sm {{ extra_classes }}">
    {% if header_title or header_content %}
    <div class="flex flex-col space-y-1.5 p-6 {% if no_header_padding %}p-0{% endif %}">
        {% if header_title %}
        <h3 class="text-lg font-semibold leading-none tracking-tight text-slate-900">
            {% if header_icon %}<i class="{{ header_icon }} mr-2"></i>{% endif %}
            {{ header_title }}
        </h3>
        {% endif %}
        {% if header_description %}
        <p class="text-sm text-slate-600">{{ header_description }}</p>
        {% endif %}
        {{ header_content }}
    </div>
    {% endif %}

    <div class="p-6 pt-0 {% if no_content_padding %}p-0{% endif %}">
        {{ content }}
    </div>

    {% if footer_content %}
    <div class="flex items-center p-6 pt-0 {% if no_footer_padding %}p-0{% endif %}">
        {{ footer_content }}
    </div>
    {% endif %}
</div>
